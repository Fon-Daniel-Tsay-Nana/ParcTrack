<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | ParcTrack Logistics</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/assets/css/admin.css">
</head>
<body>
  <div class="login-shell">
    <aside class="login-aside">
      <a href="/" class="brand" aria-label="ParcTrack Logistics home">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.2 3.6c.3-1.5 1.4-2.3 2.6-2.1" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><circle cx="16.5" cy="7.5" r="4.3" fill="#fff"/><path d="M20.3 6.2 23.4 7.6 20.3 9z" fill="#FDB022"/><circle cx="17.7" cy="6.6" r="1" fill="#102A56"/><rect x="1.8" y="9.5" width="16" height="11" rx="1.6" fill="#155EEF" stroke="#fff" stroke-width="1.8"/><path d="M2.4 10.3 9.8 15.6 17.2 10.3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>ParcTrack Logistics</span>
      </a>
      <div>
        <h1>Logistics management portal</h1>
        <p>Create shipments, issue tracking codes and keep customers informed in real time.</p>
      </div>
      <small>Connecting Destinations, Delivering Confidence.</small>
    </aside>

    <main class="login-main">
      <div class="login-card">
        <h2>Admin sign in</h2>
        <p class="muted">Authorized staff only.</p>

        <div class="alert alert-error" id="loginError" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="username" required autofocus>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button>
            </div>
          </div>
          <button class="btn" type="submit" id="loginBtn" style="width:100%">Sign in</button>
        </form>

        <p class="login-foot muted"><a href="/">&larr; Back to website</a></p>
      </div>
    </main>
  </div>

  <script src="/admin/assets/js/login.js"></script>
</body>
</html>
